name: Deploy site (1.0 + v2) to GitHub Pages

# Publishes a COMPOSITE artifact so 1.0 and 2.0 coexist on one Pages site:
#   /aoem-dashboard/           → the existing 1.0 static files (repo root)
#   /aoem-dashboard/v2/        → the built Angular 2.0 app
#   /aoem-dashboard/404.html   → path-aware SPA fallback (v2 deep links only)
#
# ⚠️ One-time setup required before the first run: in the repo Settings → Pages,
# switch "Build and deployment" Source from "Deploy from a branch" to
# "GitHub Actions". Until then the site keeps serving 1.0 from main root exactly
# as today, so nothing breaks by merging this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build composite site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install v2 dependencies
        working-directory: v2
        run: npm ci --legacy-peer-deps

      - name: Build v2 (base-href /aoem-dashboard/v2/)
        working-directory: v2
        run: npm run build:prod

      - name: Assemble composite publish directory
        run: |
          set -euo pipefail
          PUB="_site"
          rm -rf "$PUB"
          mkdir -p "$PUB"
          # 1.0: copy the repo root, excluding build/tooling dirs and the app source.
          rsync -a ./ "$PUB"/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'v2' \
            --exclude 'node_modules'
          # 2.0: the built Angular app under /v2
          mkdir -p "$PUB/v2"
          cp -r v2/dist/aoem-v2/browser/. "$PUB/v2/"
          # SPA fallback: GitHub Pages serves ONE root 404.html for the project.
          # Use v2's path-aware 404 so deep-link refreshes resolve and non-v2
          # misses show a normal not-found.
          cp v2/dist/aoem-v2/browser/404.html "$PUB/404.html"
          # Jekyll would drop Angular's _-prefixed files; disable it.
          touch "$PUB/.nojekyll"
          echo "Composite site assembled:"
          ls -la "$PUB"
          ls -la "$PUB/v2" | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "## 🚀 Deployed"
          echo "1.0 hub: ${{ steps.deployment.outputs.page_url }}"
          echo "2.0 app: ${{ steps.deployment.outputs.page_url }}v2/"
