<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primordial Conflict — Era 8 War Room</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/kvk-theme.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    background: var(--bg-deep, #0a0c14);
    color: var(--text-primary, #e8e4f0);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }
  .pc-wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 48px; }

  /* ── Schedule line (mirrors DD's StageLine) ── */
  .sl-note { font-size: 12px; color: #94a3b8; margin-top: 10px; line-height: 1.5; }

  /* ── Cards / sections ── */
  .pc-card { background: var(--bg-card, #12121c); border: 1px solid var(--border, #2a2a3a); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .pc-card h2 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: 1px; text-transform: uppercase; color: var(--kvk-accent, #9b6dff);
    margin-bottom: 12px;
  }
  .pc-card h3 { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; color: #e8eaf0; margin: 14px 0 6px; }
  .pc-card p, .pc-card li { font-size: 13.5px; line-height: 1.65; color: #b9c0cc; }
  .pc-card ul { list-style: none; padding-left: 0; }
  .pc-card li { padding: 3px 0 3px 18px; position: relative; }
  .pc-card li::before { content: '›'; position: absolute; left: 2px; color: var(--kvk-accent-dim, #6b4c9a); font-weight: 700; }

  .callout { background: var(--bg-deep, #0a0c14); border-left: 3px solid; border-radius: 0 6px 6px 0; padding: 12px 16px; margin: 12px 0; font-size: 13px; line-height: 1.6; }
  .callout.info { border-color: #5b8def; }
  .callout.warning { border-color: #e8944a; }
  .callout.important { border-color: #e74c5e; }
  .callout.strategy { border-color: var(--kvk-accent, #9b6dff); }
  .callout > strong:first-of-type { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; opacity: 0.85; color: #e8eaf0; }

  .no-troop { display:inline-block; margin-left:8px; padding:2px 9px; border-radius:999px; font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; background:rgba(61,170,109,0.16); color:#3daa6d; border:1px solid #3daa6d; }

  .pc-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
  .pc-table th { font-family:'Barlow Condensed',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#64748b; text-align:center; padding:7px 6px; border-bottom:1px solid var(--border,#2a2a3a); }
  .pc-table td { text-align:center; padding:6px; color:#b9c0cc; border-bottom:1px solid rgba(42,42,58,0.5); }
  .pc-table th:first-child, .pc-table td:first-child { text-align:left; }
  .pc-table tr:hover td { background: var(--bg-card2, #1a1a2a); }
  .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }

  /* Normalize scouting-table row height across scripts. Without an explicit
     line-height, CJK-only names (Era #088) fall back to a taller intrinsic
     "normal" metric and that whole table's rows grow. A fixed unitless value
     keeps all four server tables identical. */
  .cmp-tbl td, .cmp-tbl th { line-height: 1.3; }
  .cmp-tbl.cmp-tbl-wrap .c-nm { line-height: 1.3; }

  /* ── Header pill cluster + icon buttons (mirrors Desolate Desert) ── */
  .hdr-pills-top { position:absolute; right:16px; top:14px; z-index:12; display:inline-flex; align-items:center; gap:6px; }
  .hdr-pills { position:absolute; right:16px; bottom:14px; z-index:12; display:inline-flex; align-items:center; gap:6px; }
  .hdr-icobtn {
    display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:999px; cursor:pointer;
    background:rgba(148,163,184,0.10); border:1px solid #475569; color:#cbd5e1;
    font-size:15px; line-height:1; text-decoration:none; transition:background .15s, border-color .15s;
  }
  .hdr-icobtn:hover { background:rgba(148,163,184,0.22); border-color:#7b8496; }
  /* Workshop badge — pulses purple when the event window is live, greyed idle otherwise */
  .ws-badge {
    display:inline-flex; align-items:center; gap:7px; padding:6px 12px 6px 10px; border-radius:999px;
    cursor:pointer; text-decoration:none; font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.5px;
    background:rgba(155,109,255,0.14); border:1px solid var(--kvk-accent,#9b6dff); color:var(--kvk-accent,#9b6dff);
    animation:wsPulse 1.6s ease-in-out infinite;
  }
  .ws-badge:hover { background:rgba(155,109,255,0.24); }
  .ws-badge.is-idle { background:rgba(148,163,184,0.10); border-color:#475569; color:#94a3b8; animation:none; }
  .ws-badge.is-idle:hover { background:rgba(148,163,184,0.20); }
  .ws-badge.is-idle .ws-ico { filter:grayscale(1); opacity:.7; }
  .ws-badge .ws-ico { font-size:16px; line-height:1; }
  .ws-badge .ws-txt { font-size:13px; }
  @keyframes wsPulse { 0%,100%{ box-shadow:0 0 0 0 rgba(155,109,255,0.5);} 50%{ box-shadow:0 0 0 6px rgba(155,109,255,0);} }
  @media (prefers-reduced-motion: reduce){ .ws-badge{ animation:none; } }
  @media (max-width: 520px){
    .hdr-pills-top{ right:10px; top:10px; }
    .hdr-pills{ right:10px; bottom:10px; }
    .ws-badge .ws-txt{ font-size:12px; }
  }

  /* ── Help / info popup modal ── */
  .pc-modal { position:fixed; inset:0; z-index:10000; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,0.82); }
  .pc-modal-card { position:relative; max-width:560px; width:100%; background:#11141f; border:1px solid var(--kvk-accent,#9b6dff); border-radius:14px; padding:26px 22px 22px; text-align:left; box-shadow:0 0 40px rgba(155,109,255,0.2); max-height:86vh; overflow-y:auto; }
  .pc-modal-card h3 { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1.5px; color:var(--kvk-accent,#9b6dff); margin:0 0 14px; text-align:center; }
  .pc-modal-card p, .pc-modal-card li { font-size:13px; color:#e2e8f0; line-height:1.6; }
  .pc-modal-close { position:absolute; top:8px; right:14px; font-size:24px; line-height:1; color:#64748b; cursor:pointer; font-family:sans-serif; }
  .pc-modal-close:hover { color:#e8eaf0; }

  /* Anchor offset so in-header jump links don't hide section titles under nothing */
  .anchor-target { scroll-margin-top: 16px; }

  @media (max-width: 640px) {
    .table-scroll .pc-table { min-width: 420px; }
  }
</style>
</head>
<body data-kvk="primordial">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ─────────────────────────────────────────────────────────────────────────
// Trivial i18n stub — English only for now (mirrors the T() fallback pattern).
const T = s => s;

// ── Event config ──
// Matchmaking began Mon 2026-08-17 00:00 UTC. Seven-day arc: matching, three
// battle days (round-robin), battlefield selection, showdown, recovery. Each
// game day is a UTC calendar day; Day 2 (first battle) starts Tue Aug 18 00:00.
const EVENT = {
  startISO: "2026-08-17T00:00:00Z",
  endISO:   "2026-08-23T23:59:59Z",
  ourTime:  "19:00 UTC",           // our server's workshop / showdown window
};

// ── Servers (us first, then opponents) — colors per the user's assignment:
//    Era #028 green · Era #008 blue · Era #088 orange · Era #059 purple.
const SERVERS = [
  { code: "E#008", label: "Era #008", name: "ERAEMPIRE", us: true,  hex: "#3d7cc4", rgb: "61,124,196" },
  { code: "E#028", label: "Era #028", name: "",          us: false, hex: "#3daa6d", rgb: "61,170,109" },
  { code: "E#088", label: "Era #088", name: "",          us: false, hex: "#e8944a", rgb: "232,148,74" },
  { code: "E#059", label: "Era #059", name: "",          us: false, hex: "#9b6dff", rgb: "155,109,255" },
];
const srvColor = code => SERVERS.find(s => s.code === code) || { hex: "#94a3b8", rgb: "148,163,184" };

// ── Schedule stages (the "line"). Each: key, label, day range, ISO start. ──
const STAGES = [
  { key: "match",    label: "Matchmaking & scouting",  days: [1],    startISO: "2026-08-17T00:00:00Z" },
  { key: "battle1",  label: "Battle Day 1 (1v1)",      days: [2],    startISO: "2026-08-18T00:00:00Z" },
  { key: "battle2",  label: "Battle Day 2 (1v1)",      days: [3],    startISO: "2026-08-19T00:00:00Z" },
  { key: "battle3",  label: "Battle Day 3 (1v1)",      days: [4],    startISO: "2026-08-20T00:00:00Z" },
  { key: "select",   label: "Battlefield selection",   days: [5],    startISO: "2026-08-21T00:00:00Z" },
  { key: "showdown", label: "4-way showdown",          days: [6],    startISO: "2026-08-22T00:00:00Z" },
  { key: "recovery", label: "Troop recovery",          days: [7],    startISO: "2026-08-23T00:00:00Z" },
];
// Phase tint per stage group. Purple family: matching blue → battle lavender →
// selection neon purple → showdown deep purple → recovery light pink.
const STAGE_TINT = {
  match:    { bright: "#5b8def", dark: "#2b3a55" },
  battle1:  { bright: "#c4a7f0", dark: "#4a3d63" },
  battle2:  { bright: "#c4a7f0", dark: "#4a3d63" },
  battle3:  { bright: "#c4a7f0", dark: "#4a3d63" },
  select:   { bright: "#bf5fff", dark: "#4e2a63" },
  showdown: { bright: "#9b6dff", dark: "#453064" },
  recovery: { bright: "#f7a8c8", dark: "#5e3648" },
};

// ── Research data (overlaid from ../data/live/primordial.json) ──
let RESEARCH = null;

// ─────────────────────────────────────────────────────────────────────────
// Schedule line — a horizontal connected timeline with dots + the active
// segment animating as a barber-pole (shared .sl-line-active / .sl-dot-pulse).
function StageLine() {
  const now = Date.now();
  let cur = 0;
  STAGES.forEach((s, i) => { if (now >= Date.parse(s.startISO)) cur = i; });
  const reached = i => cur >= i;

  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 0 }}>
        {STAGES.map((s, i) => {
          const isNow = i === cur;
          const t = STAGE_TINT[s.key] || { bright: "#9b6dff", dark: "#334155" };
          const dotOn = reached(i);
          const dotColor = isNow ? t.bright : (dotOn ? t.bright : t.dark);
          const lineOn = cur >= i;
          const lineColor = lineOn ? t.bright : "#334155";
          const lineActive = i === cur && i < STAGES.length - 1;
          const dayLbl = s.days.length > 1 ? `Day ${s.days[0]}–${s.days[s.days.length - 1]}` : `Day ${s.days[0]}`;
          const labelCol = isNow ? t.bright : (dotOn ? "#cbd5e1" : "#64748b");
          return (
            <div key={s.key} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", position: "relative" }}>
              {i < STAGES.length - 1 ? (lineActive
                ? <div className="sl-line-active" style={{ position: "absolute", top: "7px", left: "50%", width: "100%", height: "3px", "--seg": t.bright }} />
                : <div style={{ position: "absolute", top: "7px", left: "50%", width: "100%", height: "3px", background: lineColor }} />) : null}
              <div className={isNow ? "sl-dot-pulse" : ""} style={{ width: "16px", height: "16px", borderRadius: "50%", background: dotColor, border: `2px solid ${dotColor}`, position: "relative", zIndex: 2 }} />
              <div style={{ fontSize: "10px", fontWeight: 700, color: labelCol, marginTop: "6px", textTransform: "uppercase", letterSpacing: "0.5px" }}>{dayLbl}</div>
              <div style={{ fontSize: "11px", color: isNow ? "#e8eaf0" : (dotOn ? "#94a3b8" : "#64748b"), marginTop: "2px", lineHeight: 1.25, padding: "0 4px" }}>{s.label}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Scouting tables (mirror DD's ServerTable / .cmp-* classes) ──
const rfmt = v => {
  if (v == null || v === "") return "—";
  if (v >= 1e9) return (v / 1e9).toFixed(2) + "B";
  if (v >= 1e6) return (v / 1e6).toFixed(1) + "M";
  return String(v);
};
const rmp = (m, p) => (m == null || m === "" || !p) ? null : (m / p) * 100;
// Match Desolate Desert: alliance M:P runs single-digit %, players run tens of %,
// so each kind gets its own thresholds (green over-performs, dim is parked power).
const allianceMpCls = pct => pct >= 8 ? "hi" : pct >= 4 ? "mid" : "lo";
const playerMpCls   = pct => pct >= 65 ? "hi" : pct >= 35 ? "mid" : "lo";

function ServerTable({ code, rows, kind }) {
  const c = srvColor(code);
  const s = SERVERS.find(x => x.code === code) || {};
  const title = s.label + (s.us ? " · Us" : "") + (s.name ? " " + s.name : "");
  const mpCls = kind === "players" ? playerMpCls : allianceMpCls;
  return (
    <div className="cmp-card" style={{ borderColor: "rgba(" + c.rgb + ",0.4)" }}>
      <div className="cmp-head" style={{ background: "rgba(" + c.rgb + ",0.12)", borderBottomColor: "rgba(" + c.rgb + ",0.4)", color: c.hex }}>
        {title}
      </div>
      {rows && rows.length ? (
        <table className="cmp-tbl cmp-tbl-wrap">
          <thead><tr><th className="c-rk">#</th><th className="c-nm"></th><th className="c-p">{T("Power")}</th><th className="c-mp">M:P</th></tr></thead>
          <tbody>
          {rows.map((r, i) => {
            const pct = rmp(r.merits, r.power);
            const nm = kind === "players"
              ? (<span>{r.name} <span className="tg">[{r.tag}]</span></span>)
              : (<span>{r.name ? r.name + " " : ""}<span className="tg">[{r.tag}]</span></span>);
            return (
              <tr key={i}>
                <td className="c-rk">{i + 1}</td>
                <td className="c-nm">{nm}</td>
                <td className="c-p" style={{ color: c.hex }}>{rfmt(r.power)}</td>
                <td className={"c-mp " + (pct != null ? mpCls(pct) : "")} style={pct == null ? { color: "#64748b" } : undefined}>{pct != null ? pct.toFixed(1) + "%" : "—"}</td>
              </tr>
            );
          })}
          </tbody>
        </table>
      ) : <div style={{ padding: "14px 12px", fontSize: 12, color: "#64748b", fontStyle: "italic" }}>{T("Awaiting scouting data.")}</div>}
    </div>
  );
}

function ResearchTab() {
  const r = RESEARCH;
  if (!r) return <div className="pc-card"><p>{T("Loading scouting data…")}</p></div>;
  const order = SERVERS.map(s => s.code);
  const mk = (code, kind) => {
    const src = (r[code] || {})[kind] || [];
    return src.map(a => kind === "players"
      ? { name: a[0], tag: a[1], power: a[2], merits: a[3] }
      : { tag: a[0], name: a[1], power: a[2], merits: a[3] });
  };
  return (
    <div>
      <div className="pc-card">
        <h2>{T("Top Alliances")}</h2>
        <div className="cmp-grid">
          {order.map(code => <ServerTable key={code} code={code} rows={mk(code, "alliances")} kind="alliances" />)}
        </div>
        <p className="sl-note">{T("Top 4 alliances per server by Power, with total Merits. M:P (merits ÷ power) flags combat output vs raw size — green over-performs, dim is parked power. Non-Latin names transcribed verbatim from in-game screenshots; verify before calling out individuals.")}</p>
      </div>
      <div className="pc-card">
        <h2>{T("Top Players")}</h2>
        <div className="cmp-grid">
          {order.map(code => <ServerTable key={code} code={code} rows={mk(code, "players")} kind="players" />)}
        </div>
        <p className="sl-note">{T("Top 12 by Power per server (Matchmaking stage). M:P shown where the player also appears on the Merits board; “—” means they weren't in the top Merits list.")}</p>
      </div>
    </div>
  );
}

// ── Tabs ──
const TABS = [
  { id: "overview", label: T("Overview") },
  { id: "scouting", label: T("Scouting") },
  { id: "schedule", label: T("Day-by-Day") },
  { id: "scoring",  label: T("Scoring") },
];

function OverviewTab() {
  return (
    <div>
      <div className="pc-card">
        <h2>{T("Event Timeline")}</h2>
        <StageLine />
        <p className="sl-note">{T("Seven-day, four-kingdom round-robin. Matchmaking opened Mon Aug 17 (00:00 UTC). Three 1v1 battle days (Day 2 starts Tue Aug 18), then the leading kingdom picks the showdown battlefield & time, a 4-way showdown, and a recovery day.")}</p>
      </div>

      <div className="pc-card">
        <h2>{T("This Cycle")}</h2>
        <p>{T("Primordial Conflict pairs four kingdoms — us (Era #008) against Era #028, Era #088, and Era #059 — in a round-robin. Scout tabs carry each server's top alliances and players.")}</p>
        <div className="callout important">
          <strong>{T("No Troop Loss — Special KvK")}</strong>
          {T("This is a special Primordial Conflict where no troop loss occurs. Units \"wounded\" in PvP are recovered, so there is no lasting attrition — a strong reason to PvP freely and contest every objective aggressively.")}
        </div>
        <div className="callout info">
          <strong>{T("Our Workshop / Showdown Window")}</strong>
          {T("Our server's workshop event runs at")} <strong style={{ color: "var(--kvk-accent)" }}>{EVENT.ourTime}</strong> {T("the whole phase (afternoon US, evening EU — our prime time). The opponent's event runs at their server's voted time each battle day; confirm it in-client, the vote display has been unreliable.")}
        </div>
      </div>

      <div className="pc-card">
        <h2>{T("Event Structure")}</h2>
        <p>{T("A 4-server round-robin KvK. Three days of 1v1 battles (Days 2–4) where you face each opponent once, then a battlefield selection by the leading kingdom (Day 5), a 4-way showdown (Day 6), and partial troop recovery (Day 7).")}</p>
        <h3>{T("Core Loop")}</h3>
        <p>{T("During battle days you earn Primordial Dew by gathering at Alchemy Pools and fighting over Order Workshops. Each day's 1v1 has two workshop events — one on each server (3 workshops each). Dew converts to Primordial Points for scoring. On the showdown day, Essence Refineries appear around the chosen Imperial City; holding them generates Primordial Essence and massive Kingdom Points.")}</p>
      </div>
    </div>
  );
}

function ScheduleTab() {
  return (
    <div>
      <div id="day-by-day" className="pc-card anchor-target">
        <h2>{T("Day-by-Day")}</h2>
        <StageLine />
        <p className="sl-note">{T("The seven-day arc at a glance. Section detail below; the Order Workshop and Day 6 Showdown playbooks are folded in.")}</p>
      </div>

      <div className="pc-card">
        <h2>{T("Day 1 — Matchmaking & Display")}</h2>
        <p>{T("View event rules, participating kingdoms, schedule and rewards. No combat or gathering yet. Scout opponent servers (see the Scouting tab) and coordinate assignments.")}</p>
      </div>

      <div className="pc-card">
        <h2>{T("Days 2–4 — Battle Stage (Round Robin)")}</h2>
        <p>{T("Each day your kingdom is paired 1v1 against a different opponent. Two activities run across the three battle days: Alchemy Pool gathering (passive Dew) and Order Workshop contests (twice-daily PvP objectives).")}</p>
      </div>

      {/* ── Order Workshop (folds in the Order Workshop flyer) ── */}
      <div id="order-workshop" className="pc-card anchor-target">
        <h2>🔧 {T("Order Workshop")}</h2>
        <p>{T("Two workshop events run every battle day — one on each paired server, 3 workshops each (6 total). Each server votes its own time; ours is locked at")} <strong style={{ color: "var(--kvk-accent)" }}>19:00 UTC</strong> {T("and held all phase. You also fight the opponent's event at their time. Each contest lasts 1 hour.")}</p>
        <h3>{T("What Spawns")}</h3>
        <ul>
          <li>{T("3 workshops per contest — 1 per Zone 2 region, randomly placed each round.")}</li>
          <li>{T("Large square capture zone, no player cap — flood it. More bodies = faster capture timer.")}</li>
          <li>{T("Timer → 0 = captured (permanent). Teleport nearby, then walk in on foot.")}</li>
        </ul>
        <h3>{T("Rewards")}</h3>
        <ul>
          <li>{T("600M points on capture (400M cap + 200M if leading at contest end).")}</li>
          <li>{T("+500 pts/sec per person inside — every tier counts equally (T1 = T8 for pts/sec).")}</li>
        </ul>
        <div className="callout important">
          <strong>{T("Stay Inside Until Fully Capped")}</strong>
          {T("Do not leave to farm or PvP — every person counts toward the timer. If you lose a workshop, retreat to one you already hold: every second inside a held workshop earns points, and retreating pulls the enemy off their own workshop.")}
        </div>
        <h3>{T("Roles")}</h3>
        <ul>
          <li><strong>{T("Fighter")}</strong> — {T("get inside, fight, displace enemy marches, contest the zone.")}</li>
          <li><strong>{T("Kraken")}</strong> — {T("block enemy entry; position between the enemy and the workshop to cut off their flow.")}</li>
          <li><strong>{T("Non-Fighter / Support")}</strong> — {T("Tier-1 marches only, placed on the far edge away from enemy flow — adds presence & pts/sec without risk.")}</li>
        </ul>
        <div className="callout strategy">
          <strong>{T("Target 2, Not 3")}</strong>
          {T("Three workshops spreads forces thin — slower caps, fewer people soaking pts/sec in each. Pick 2 and dominate them; chase the 3rd only if leadership calls it. Every minute away from a held workshop costs 500 pts/s/person plus free PvP points to the enemy.")}
        </div>
        <div className="callout warning">
          <strong>{T("Citadel Watch")}</strong>
          {T("This is a 1-hour PvP window. If your citadel is vulnerable or threatened during the event, bubble up immediately — don't assume someone else has seen it.")}
        </div>
      </div>

      <div className="pc-card">

// Our workshop event runs 19:00–20:00 UTC each battle day (Days 2–4). Returns
// {live, next} so the header badge can pulse during the window and grey out
// otherwise — dynamic to when the event is on, like DD's Tower badge.
function workshopStatus(now) {
  const days = ["2026-08-18", "2026-08-19", "2026-08-20"]; // battle days (Days 2–4)
  for (const d of days) {
    const start = Date.parse(d + "T19:00:00Z");
    const end = Date.parse(d + "T20:00:00Z");
    if (now >= start && now < end) return { live: true, next: null };
  }
  for (const d of days) {
    const start = Date.parse(d + "T19:00:00Z");
    if (now < start) return { live: false, next: start };
  }
  return { live: false, next: null };
}
