<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primordial Conflict — Era 8 War Room</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/kvk-theme.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    background: var(--bg-deep, #0a0c14);
    color: var(--text-primary, #e8e4f0);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }
  .pc-wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 48px; }

  /* ── Schedule line (mirrors DD's StageLine) ── */
  .sl-note { font-size: 12px; color: #94a3b8; margin-top: 10px; line-height: 1.5; }

  /* ── Cards / sections ── */
  .pc-card { background: var(--bg-card, #12121c); border: 1px solid var(--border, #2a2a3a); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .pc-card h2 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: 1px; text-transform: uppercase; color: var(--kvk-accent, #9b6dff);
    margin-bottom: 12px;
  }
  .pc-card h3 { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; color: #e8eaf0; margin: 14px 0 6px; }
  .pc-card p, .pc-card li { font-size: 13.5px; line-height: 1.65; color: #b9c0cc; }
  .pc-card ul { list-style: none; padding-left: 0; }
  .pc-card li { padding: 3px 0 3px 18px; position: relative; }
  .pc-card li::before { content: '›'; position: absolute; left: 2px; color: var(--kvk-accent-dim, #6b4c9a); font-weight: 700; }

  .callout { background: var(--bg-deep, #0a0c14); border-left: 3px solid; border-radius: 0 6px 6px 0; padding: 12px 16px; margin: 12px 0; font-size: 13px; line-height: 1.6; }
  .callout.info { border-color: #5b8def; }
  .callout.warning { border-color: #e8944a; }
  .callout.important { border-color: #e74c5e; }
  .callout.strategy { border-color: var(--kvk-accent, #9b6dff); }
  .callout > strong:first-of-type { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; opacity: 0.85; color: #e8eaf0; }

  .no-troop { display:inline-block; margin-left:8px; padding:2px 9px; border-radius:999px; font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; background:rgba(61,170,109,0.16); color:#3daa6d; border:1px solid #3daa6d; }

  .pc-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
  .pc-table th { font-family:'Barlow Condensed',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#64748b; text-align:center; padding:7px 6px; border-bottom:1px solid var(--border,#2a2a3a); }
  .pc-table td { text-align:center; padding:6px; color:#b9c0cc; border-bottom:1px solid rgba(42,42,58,0.5); }
  .pc-table th:first-child, .pc-table td:first-child { text-align:left; }
  .pc-table tr:hover td { background: var(--bg-card2, #1a1a2a); }
  .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }

  /* Normalize scouting-table row height across scripts. Without an explicit
     line-height, CJK-only names (Era #088) fall back to a taller intrinsic
     "normal" metric and that whole table's rows grow. A fixed unitless value
     keeps all four server tables identical. */
  .cmp-tbl td, .cmp-tbl th { line-height: 1.3; }
  .cmp-tbl.cmp-tbl-wrap .c-nm { line-height: 1.3; }

  /* ── Header pill cluster + icon buttons (mirrors Desolate Desert) ── */
  .hdr-pills-top { position:absolute; right:16px; top:14px; z-index:12; display:inline-flex; align-items:center; gap:6px; }
  .hdr-pills { position:absolute; right:16px; bottom:14px; z-index:12; display:inline-flex; align-items:center; gap:6px; }
  .hdr-icobtn {
    display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:999px; cursor:pointer;
    background:rgba(148,163,184,0.10); border:1px solid #475569; color:#cbd5e1;
    font-size:15px; line-height:1; text-decoration:none; transition:background .15s, border-color .15s;
  }
  .hdr-icobtn:hover { background:rgba(148,163,184,0.22); border-color:#7b8496; }
  /* Workshop badge — pulses purple when the event window is live, greyed idle otherwise */
  .ws-badge {
    display:inline-flex; align-items:center; gap:7px; padding:6px 12px 6px 10px; border-radius:999px;
    cursor:pointer; text-decoration:none; font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.5px;
    background:rgba(155,109,255,0.14); border:1px solid var(--kvk-accent,#9b6dff); color:var(--kvk-accent,#9b6dff);
    animation:wsPulse 1.6s ease-in-out infinite;
  }
  .ws-badge:hover { background:rgba(155,109,255,0.24); }
  .ws-badge.is-idle { background:rgba(148,163,184,0.10); border-color:#475569; color:#94a3b8; animation:none; }
  .ws-badge.is-idle:hover { background:rgba(148,163,184,0.20); }
  .ws-badge.is-idle .ws-ico { filter:grayscale(1); opacity:.7; }
  .ws-badge .ws-ico { font-size:16px; line-height:1; }
  .ws-badge .ws-txt { font-size:13px; }
  @keyframes wsPulse { 0%,100%{ box-shadow:0 0 0 0 rgba(155,109,255,0.5);} 50%{ box-shadow:0 0 0 6px rgba(155,109,255,0);} }
  @media (prefers-reduced-motion: reduce){ .ws-badge{ animation:none; } }
  @media (max-width: 520px){
    .hdr-pills-top{ right:10px; top:10px; }
    .hdr-pills{ right:10px; bottom:10px; }
    .ws-badge .ws-txt{ font-size:12px; }
  }

  /* ── Help / info popup modal ── */
  .pc-modal { position:fixed; inset:0; z-index:10000; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,0.82); }
  .pc-modal-card { position:relative; max-width:560px; width:100%; background:#11141f; border:1px solid var(--kvk-accent,#9b6dff); border-radius:14px; padding:26px 22px 22px; text-align:left; box-shadow:0 0 40px rgba(155,109,255,0.2); max-height:86vh; overflow-y:auto; }
  .pc-modal-card h3 { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1.5px; color:var(--kvk-accent,#9b6dff); margin:0 0 14px; text-align:center; }
  .pc-modal-card p, .pc-modal-card li { font-size:13px; color:#e2e8f0; line-height:1.6; }
  .pc-modal-close { position:absolute; top:8px; right:14px; font-size:24px; line-height:1; color:#64748b; cursor:pointer; font-family:sans-serif; }
  .pc-modal-close:hover { color:#e8eaf0; }

  /* Anchor offset so in-header jump links don't hide section titles under nothing */
  .anchor-target { scroll-margin-top: 16px; }

  /* ── Workshop schedule slots (mirrors DD's Tower schedule) ── */
  .ws-slot { display:flex; flex-direction:column; gap:4px; padding:11px 10px; border-radius:9px;
    border:1px solid rgba(155,109,255,0.28); background:rgba(155,109,255,0.06); }
  .ws-slot.is-live { border-color:var(--kvk-accent,#9b6dff); background:rgba(155,109,255,0.16); box-shadow:0 0 16px rgba(155,109,255,0.22); }
  .ws-slot.is-next { border-color:#7c5bb0; }
  .ws-slot.is-passed { opacity:0.6; }
  .ws-slot .ws-day { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px; letter-spacing:.5px; color:#e2e8f0; }
  .ws-slot .ws-state { font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; }
  .ws-live-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--kvk-accent,#9b6dff);
    box-shadow:0 0 6px var(--kvk-accent,#9b6dff); margin-right:5px; vertical-align:middle; animation:wsDot 1.2s ease-in-out infinite; }
  @keyframes wsDot { 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  @media (prefers-reduced-motion: reduce){ .ws-live-dot{ animation:none; } }
  /* Workshop live popup modal */
  .ws-modal { position:fixed; inset:0; z-index:10000; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,0.82); }
  .ws-modal-card { position:relative; max-width:400px; width:100%; background:#11141f; border:1px solid var(--kvk-accent,#9b6dff); border-radius:14px; padding:26px 22px 22px; text-align:center; box-shadow:0 0 40px rgba(155,109,255,0.22); }
  .ws-modal-card h3 { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1.5px; color:var(--kvk-accent,#9b6dff); margin:8px 0 6px; }
  .ws-modal-close { position:absolute; top:8px; right:14px; font-size:24px; line-height:1; color:#64748b; cursor:pointer; font-family:sans-serif; }
  .ws-modal-close:hover { color:#e8eaf0; }
  .ws-modal-cd { font-variant-numeric:tabular-nums; font-size:22px; font-weight:700; color:var(--kvk-accent,#9b6dff); }

  @media (max-width: 640px) {
    .table-scroll .pc-table { min-width: 420px; }
  }

  /* ── PVE Guide: mechanic layout (graphic beside condensed facts) ── */
  .mech { display:grid; grid-template-columns: minmax(190px, 240px) 1fr; gap:18px; align-items:start; }
  @media (max-width: 620px) { .mech { grid-template-columns: 1fr; } }
  .mech .fig { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .mech .figcap { font-size:11px; color:#64748b; text-align:center; line-height:1.4; }
  .facts { list-style:none; padding:0; margin:0; }
  .facts li { position:relative; padding:5px 0 5px 22px; font-size:13px; line-height:1.5; color:#c3c9d4; border-bottom:1px solid rgba(42,42,58,0.5); }
  .facts li:last-child { border-bottom:none; }
  .facts li .ic { position:absolute; left:0; top:4px; font-size:14px; line-height:1; }
  .facts b { color:#e8eaf0; }
  .facts .big { color:var(--kvk-accent); font-weight:700; }

  /* Order Workshop capture-zone diagram (ported from the flyer) */
  .sq-diagram { position:relative; width:188px; height:188px; margin:4px auto; }
  .sq-outer { position:absolute; inset:0; border:2px dashed rgba(155,109,255,0.4); background:rgba(155,109,255,0.05); border-radius:4px; }
  .sq-label-outer { position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-size:9px; letter-spacing:1px; text-transform:uppercase; color:#7c5bb0; white-space:nowrap; }
  .sq-ws { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:44px; height:44px; background:rgba(155,109,255,0.14); border:2px solid var(--kvk-accent); border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:22px; z-index:3; }
  .sq-march { position:absolute; width:20px; height:20px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:11px; z-index:4; }
  .march-friendly { background:rgba(61,170,109,0.2); border:1px solid rgba(61,170,109,0.5); }
  .march-t1 { background:rgba(91,141,239,0.2); border:1px solid rgba(91,141,239,0.45); }
  .march-kraken { background:rgba(155,109,255,0.15); border:1px solid rgba(155,109,255,0.45); }
  .march-enemy { background:rgba(196,61,61,0.2); border:1px solid rgba(196,61,61,0.5); }
  .legend-row { display:flex; flex-wrap:wrap; gap:10px 14px; justify-content:center; font-size:11px; color:#94a3b8; margin-top:2px; }
  .legend-row span { display:inline-flex; align-items:center; gap:5px; }
  .legend-row .sw { width:11px; height:11px; border-radius:3px; display:inline-block; }
</style>
</head>
<body data-kvk="primordial">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ─────────────────────────────────────────────────────────────────────────
// Trivial i18n stub — English only for now (mirrors the T() fallback pattern).
const T = s => s;

// ── Event config ──
// Matchmaking began Mon 2026-08-17 00:00 UTC. Seven-day arc: matching, three
// battle days (round-robin), battlefield selection, showdown, recovery. Each
// game day is a UTC calendar day; Day 2 (first battle) starts Tue Aug 18 00:00.
const EVENT = {
  startISO: "2026-08-17T00:00:00Z",
  endISO:   "2026-08-23T23:59:59Z",
  ourTime:  "19:00 UTC",           // our server's workshop / showdown window
};

// ── Servers (us first, then opponents) — colors per the user's assignment:
//    Era #028 green · Era #008 blue · Era #088 orange · Era #059 purple.
const SERVERS = [
  { code: "E#008", label: "Era #008", name: "ERAEMPIRE", us: true,  hex: "#3d7cc4", rgb: "61,124,196" },
  { code: "E#028", label: "Era #028", name: "",          us: false, hex: "#3daa6d", rgb: "61,170,109" },
  { code: "E#088", label: "Era #088", name: "",          us: false, hex: "#e8944a", rgb: "232,148,74" },
  { code: "E#059", label: "Era #059", name: "",          us: false, hex: "#9b6dff", rgb: "155,109,255" },
];
const srvColor = code => SERVERS.find(s => s.code === code) || { hex: "#94a3b8", rgb: "148,163,184" };

// Kingdom Points standings, overlaid from ../data/live/primordial.json
// (kingdomScoreboard: [{server, points}]). Empty/0 until battle scores come in.
let KINGDOM_SCOREBOARD = [];
let SCORE_UPDATED = "";

// Persistent Kingdom Standings bar (mirrors Desolate Desert's KingdomBar): a
// single stacked bar, one segment per kingdom, colored per our assignment. When
// there are no points yet (like now), it still shows — split equally at 0.
function KingdomBar() {
  const GRAD = {
    "E#008": { grad: "linear-gradient(90deg, #2456a0, #3d7cc4)", top: "#5b9bd8" }, // blue (us)
    "E#028": { grad: "linear-gradient(90deg, #1f7a4d, #3daa6d)", top: "#4fc386" }, // green
    "E#088": { grad: "linear-gradient(90deg, #b4500f, #e8944a)", top: "#f0a860" }, // orange
    "E#059": { grad: "linear-gradient(90deg, #6d28d9, #9b6dff)", top: "#b18cff" }, // purple
  };
  const rowFor = code => (KINGDOM_SCOREBOARD || []).find(k => k.server === code) || {};
  const num = v => Number(String(v ?? 0).replace(/,/g, "")) || 0;
  const segs = SERVERS.map(s => { const r = rowFor(s.code); return { code: s.code, label: s.label, us: s.us, g: GRAD[s.code], pts: num(r.points), dew: num(r.dew) }; });
  const total = segs.reduce((a, x) => a + x.pts, 0);
  const awaiting = !total; // no scores yet → split equally, still render the bar
  const widthPct = s => awaiting ? (100 / segs.length) : (s.pts / total) * 100;
  const fmt = n => n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n.toLocaleString();
  // ranked standings (most points first) for the points + Kingdom Dew line below the bar
  return (
    <div>
      <div style={{ display: "flex", width: "100%", marginBottom: "6px" }}>
        {segs.map(s => { const pct = widthPct(s); return (
          <div key={s.code} style={{ width: pct + "%", textAlign: "center", padding: "0 2px", overflow: "hidden" }}>
            {pct >= 8 ? <div style={{ fontSize: "12px", fontWeight: 700, color: s.g.top, lineHeight: 1.2, whiteSpace: "nowrap" }}>{s.label}{s.us ? " (Us)" : ""}</div> : null}
            {pct >= 8 ? <div style={{ fontSize: "12px", fontWeight: 600, color: "#cbd5e1", lineHeight: 1.2, fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>{awaiting ? "0" : (<React.Fragment>{fmt(s.pts)} <span style={{ color: "#7aa7d8" }}>💧 {fmt(s.dew)}</span></React.Fragment>)}</div> : null}
          </div>
        ); })}
      </div>
      <div style={{ display: "flex", width: "100%", height: "22px", borderRadius: "6px", overflow: "hidden", border: "1px solid #334155" }}>
        {segs.map(s => { const pct = widthPct(s); return (
          <div key={s.code} title={s.label + ": " + s.pts.toLocaleString() + " pts · " + s.dew.toLocaleString() + " Kingdom Dew" + (awaiting ? " (awaiting data)" : " (" + pct.toFixed(1) + "%)")} style={{ width: pct + "%", background: s.g.grad, borderRight: "1px solid rgba(0,0,0,0.3)" }} />
        ); })}
      </div>
    </div>
  );
}

// ── Schedule stages (the "line"). Each: key, label, day range, ISO start,
//    `group` (consecutive same-group stages get one label above the timeline). ──
const STAGES = [
  { key: "match",    group: "match",    label: "Matchmaking & scouting",  days: [1],    startISO: "2026-08-17T00:00:00Z" },
  { key: "battle1",  group: "battle",   label: "Battle Day 1 (1v1)",      days: [2],    startISO: "2026-08-18T00:00:00Z" },
  { key: "battle2",  group: "battle",   label: "Battle Day 2 (1v1)",      days: [3],    startISO: "2026-08-19T00:00:00Z" },
  { key: "battle3",  group: "battle",   label: "Battle Day 3 (1v1)",      days: [4],    startISO: "2026-08-20T00:00:00Z" },
  { key: "select",   group: "select",   label: "Battlefield selection",   days: [5],    startISO: "2026-08-21T00:00:00Z" },
  { key: "showdown", group: "showdown", label: "4-way showdown",          days: [6],    startISO: "2026-08-22T00:00:00Z" },
  { key: "recovery", group: "recovery", label: "Troop recovery",          days: [7],    startISO: "2026-08-23T00:00:00Z" },
];
// Phase groups: label shown above the timeline + bright/dim colors. Purple family:
// matching blue → battle lavender → selection neon purple → showdown deep purple
// → recovery light pink.
const STAGE_GROUPS = {
  match:    { label: "Matchmaking", bright: "#5b8def", dark: "#2b3a55" },
  battle:   { label: "Battle Stage", bright: "#c4a7f0", dark: "#4a3d63" },
  select:   { label: "Selection",   bright: "#bf5fff", dark: "#4e2a63" },
  showdown: { label: "Showdown",    bright: "#9b6dff", dark: "#453064" },
  recovery: { label: "Recovery",    bright: "#f7a8c8", dark: "#5e3648" },
};
const STAGE_TINT = Object.fromEntries(STAGES.map(s => [s.key, STAGE_GROUPS[s.group]]));

// Current event day (1–7) from today's UTC date; 0 before it starts, capped at 7.
function currentEventDay(now) {
  const startDay = Date.parse("2026-08-17T00:00:00Z");
  if (now < startDay) return 0;
  const d = Math.floor((now - startDay) / 86400000) + 1;
  return Math.min(7, d);
}

// Daily objectives (per player), modeled on Desolate Desert's list — drawn from
// the Primordial mechanics on this dashboard + the Order Workshop / Day 6 flyers.
// `opensDay` locks a row until that game day; `target` null = unlimited/scaling.
const DAILY_OBJECTIVES = [
  { name: "Gather Primordial Dew", target: null, note: "Alchemy Pools (Lv.1–4). 100 Dew → 10K points. Run 1 march on a Lv.4 pool + the rest on Lv.3." },
  { name: "Lv.4 Pool Hyena Kills", target: null, opensDay: 2, note: "Land the killing blow on a Corrupted Hyena for +10% gather speed at that pool (only 3 near the IC, refresh 12h)." },
  { name: "Order Workshop Caps", target: null, opensDay: 2, note: "Capture workshops in our 19:00 event + the opponent's. 600M on capture, +200M if held at end." },
  { name: "Workshop Stationing", target: null, opensDay: 2, note: "Stay inside a held workshop — +500 pts/sec per person. Every tier counts equally." },
  { name: "Combat Eliminations", target: null, opensDay: 2, note: "Score PvP within tier gap ≤ 2. No troop loss this cycle — fight freely." },
  { name: "Primordial Essence", target: null, opensDay: 6, note: "Day 6 only — garrison a refinery (50K+ units) for 1/sec, plus 1 per 500 combat pts (max 70K)." },
];

// ── Research data (overlaid from ../data/live/primordial.json) ──
let RESEARCH = null;

// ─────────────────────────────────────────────────────────────────────────
// Schedule line — a horizontal connected timeline with dots + the active
// segment animating as a barber-pole (shared .sl-line-active / .sl-dot-pulse).
function StageLine() {
  const now = Date.now();
  let cur = 0;
  STAGES.forEach((s, i) => { if (now >= Date.parse(s.startISO)) cur = i; });
  const reached = i => cur >= i;

  // Consecutive same-group stages → one label above the timeline, centered over
  // that run and colored to the group (mirrors Desolate Desert's zone labels).
  const runs = [];
  STAGES.forEach((s, i) => {
    const last = runs[runs.length - 1];
    if (last && last.group === s.group) { last.lastIdx = i; }
    else runs.push({ group: s.group, firstIdx: i, lastIdx: i });
  });
  const N = STAGES.length;
  const dotPct = i => ((i + 0.5) / N) * 100; // center of stage i's column

  return (
    <div>
      {/* grouped phase labels, centered over each run */}
      <div style={{ position: "relative", height: "16px", marginBottom: "4px" }}>
        {runs.map(r => {
          const g = STAGE_GROUPS[r.group] || {};
          const reachedRun = cur >= r.firstIdx;
          const centerPct = (dotPct(r.firstIdx) + dotPct(r.lastIdx)) / 2;
          return (
            <span key={r.group + r.firstIdx} style={{ position: "absolute", left: centerPct + "%", transform: "translateX(-50%)", fontFamily: "'Barlow Condensed', sans-serif", fontSize: "11px", fontWeight: 700, letterSpacing: "1px", textTransform: "uppercase", whiteSpace: "nowrap", color: reachedRun ? g.bright : g.dark }}>{g.label}</span>
          );
        })}
      </div>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 0 }}>
        {STAGES.map((s, i) => {
          const isNow = i === cur;
          const t = STAGE_TINT[s.key] || { bright: "#9b6dff", dark: "#334155" };
          const dotOn = reached(i);
          const dotColor = isNow ? t.bright : (dotOn ? t.bright : t.dark);
          const lineOn = cur >= i;
          const lineColor = lineOn ? t.bright : "#334155";
          const lineActive = i === cur && i < STAGES.length - 1;
          const dayLbl = s.days.length > 1 ? `Day ${s.days[0]}–${s.days[s.days.length - 1]}` : `Day ${s.days[0]}`;
          const labelCol = isNow ? t.bright : (dotOn ? "#cbd5e1" : "#64748b");
          return (
            <div key={s.key} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", position: "relative" }}>
              {i < STAGES.length - 1 ? (lineActive
                ? <div className="sl-line-active" style={{ position: "absolute", top: "7px", left: "50%", width: "100%", height: "3px", "--seg": t.bright }} />
                : <div style={{ position: "absolute", top: "7px", left: "50%", width: "100%", height: "3px", background: lineColor }} />) : null}
              <div className={isNow ? "sl-dot-pulse" : ""} style={{ width: "16px", height: "16px", borderRadius: "50%", background: dotColor, border: `2px solid ${dotColor}`, position: "relative", zIndex: 2 }} />
              <div style={{ fontSize: "10px", fontWeight: 700, color: labelCol, marginTop: "6px", textTransform: "uppercase", letterSpacing: "0.5px" }}>{dayLbl}</div>
              <div style={{ fontSize: "11px", color: isNow ? "#e8eaf0" : (dotOn ? "#94a3b8" : "#64748b"), marginTop: "2px", lineHeight: 1.25, padding: "0 4px" }}>{s.label}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Scouting tables (mirror DD's ServerTable / .cmp-* classes) ──
const rfmt = v => {
  if (v == null || v === "") return "—";
  if (v >= 1e9) return (v / 1e9).toFixed(2) + "B";
  if (v >= 1e6) return (v / 1e6).toFixed(1) + "M";
  return String(v);
};
const rmp = (m, p) => (m == null || m === "" || !p) ? null : (m / p) * 100;
// Match Desolate Desert: alliance M:P runs single-digit %, players run tens of %,
// so each kind gets its own thresholds (green over-performs, dim is parked power).
const allianceMpCls = pct => pct >= 8 ? "hi" : pct >= 4 ? "mid" : "lo";
const playerMpCls   = pct => pct >= 65 ? "hi" : pct >= 35 ? "mid" : "lo";

function ServerTable({ code, rows, kind }) {
  const c = srvColor(code);
  const s = SERVERS.find(x => x.code === code) || {};
  const title = s.label + (s.us ? " · Us" : "") + (s.name ? " " + s.name : "");
  const mpCls = kind === "players" ? playerMpCls : allianceMpCls;
  return (
    <div className="cmp-card" style={{ borderColor: "rgba(" + c.rgb + ",0.4)" }}>
      <div className="cmp-head" style={{ background: "rgba(" + c.rgb + ",0.12)", borderBottomColor: "rgba(" + c.rgb + ",0.4)", color: c.hex }}>
        {title}
      </div>
      {rows && rows.length ? (
        <table className="cmp-tbl cmp-tbl-wrap">
          <thead><tr><th className="c-rk">#</th><th className="c-nm"></th><th className="c-p">{T("Power")}</th><th className="c-mp">M:P</th></tr></thead>
          <tbody>
          {rows.map((r, i) => {
            const pct = rmp(r.merits, r.power);
            const nm = kind === "players"
              ? (<span>{r.name} <span className="tg">[{r.tag}]</span></span>)
              : (<span>{r.name ? r.name + " " : ""}<span className="tg">[{r.tag}]</span></span>);
            return (
              <tr key={i}>
                <td className="c-rk">{i + 1}</td>
                <td className="c-nm">{nm}</td>
                <td className="c-p" style={{ color: c.hex }}>{rfmt(r.power)}</td>
                <td className={"c-mp " + (pct != null ? mpCls(pct) : "")} style={pct == null ? { color: "#64748b" } : undefined}>{pct != null ? pct.toFixed(1) + "%" : "—"}</td>
              </tr>
            );
          })}
          </tbody>
        </table>
      ) : <div style={{ padding: "14px 12px", fontSize: 12, color: "#64748b", fontStyle: "italic" }}>{T("Awaiting scouting data.")}</div>}
    </div>
  );
}

function ResearchTab() {
  const r = RESEARCH;
  if (!r) return <div className="pc-card"><p>{T("Loading scouting data…")}</p></div>;
  const order = SERVERS.map(s => s.code);
  const mk = (code, kind) => {
    const src = (r[code] || {})[kind] || [];
    return src.map(a => kind === "players"
      ? { name: a[0], tag: a[1], power: a[2], merits: a[3] }
      : { tag: a[0], name: a[1], power: a[2], merits: a[3] });
  };
  return (
    <div>
      <div className="pc-card">
        <h2>{T("Top Alliances")}</h2>
        <div className="cmp-grid">
          {order.map(code => <ServerTable key={code} code={code} rows={mk(code, "alliances")} kind="alliances" />)}
        </div>
        <p className="sl-note">{T("Top 4 alliances per server by Power, with total Merits. M:P (merits ÷ power) flags combat output vs raw size — green over-performs, dim is parked power. Non-Latin names transcribed verbatim from in-game screenshots; verify before calling out individuals.")}</p>
      </div>
      <div className="pc-card">
        <h2>{T("Top Players")}</h2>
        <div className="cmp-grid">
          {order.map(code => <ServerTable key={code} code={code} rows={mk(code, "players")} kind="players" />)}

        <p className="sl-note">{T("Top 12 by Power per server (Matchmaking stage). M:P shown where the player also appears on the Merits board; “—” means they weren't in the top Merits list.")}</p>
      </div>
    </div>
  );
}

// Our server's Order Workshop event runs 19:00–20:00 UTC on each of the three
// battle days (Day 2 = Aug 18 … Day 4 = Aug 20). Results are overlaid from
// primordial.json (workshopResults[]) — each row is our fight that day.
const WORKSHOP_DAYS = [
  { day: 2, date: "2026-08-18" },
  { day: 3, date: "2026-08-19" },
  { day: 4, date: "2026-08-20" },
];
let WORKSHOP_RESULTS = [];  // [{day, opponent, ourCaps, theirCaps, theirTime, note}]

// Full status, modeled on DD's torStatus. Lifecycle: "locked" during matchmaking
// (before Day 2 opens) and after Day 4 closes; otherwise per-day states
// passed/live/next/upcoming, plus msToEnd for the live countdown.
function workshopStatus(now) {
  const firstOpen = Date.parse(WORKSHOP_DAYS[0].date + "T19:00:00Z");
  const lastClose = Date.parse(WORKSHOP_DAYS[WORKSHOP_DAYS.length - 1].date + "T20:00:00Z");
  const beforeStart = now < Date.parse(WORKSHOP_DAYS[0].date + "T00:00:00Z"); // matchmaking / pre-battle
  const afterEnd = now >= lastClose;
  let liveIdx = -1, nextIdx = -1;
  WORKSHOP_DAYS.forEach((w, i) => {
    const s = Date.parse(w.date + "T19:00:00Z"), e = Date.parse(w.date + "T20:00:00Z");
    if (now >= s && now < e) liveIdx = i;
    if (nextIdx === -1 && now < s) nextIdx = i;
  });
  const live = liveIdx !== -1;
  const states = WORKSHOP_DAYS.map((w, i) => {
    const s = Date.parse(w.date + "T19:00:00Z"), e = Date.parse(w.date + "T20:00:00Z");
    if (i === liveIdx) return "live";
    if (i === nextIdx) return "next";
    if (now >= e) return "passed";
    return "upcoming";
  });
  let msToEnd = 0;
  if (live) msToEnd = Math.max(0, Date.parse(WORKSHOP_DAYS[liveIdx].date + "T20:00:00Z") - now);
  const lock = beforeStart ? "The Order Workshop event opens on Battle Day 1 (Tue Aug 18, 19:00 UTC)"
             : (afterEnd ? "The Battle Stage is complete — Order Workshops have closed" : null);
  return { live, liveIdx, nextIdx, states, msToEnd, lock, beforeStart, afterEnd };
}

const wsResultFor = day => WORKSHOP_RESULTS.find(r => r.day === day) || null;
// "X / 3" cap string for a result cell; blank if not captured yet.
const capStr = n => (n == null || n === "") ? "—" : n + " / 3";

// Popup that fires once each time the workshop window goes live (edge-detected),
// mirroring DD's TowerLiveModal.
function WorkshopLiveModal() {
  const [now, setNow] = useState(() => Date.now());
  const [open, setOpen] = useState(false);
  const wasLive = React.useRef(false);
  useEffect(() => { const id = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(id); }, []);
  const st = workshopStatus(now);
  useEffect(() => {
    if (st.live && !wasLive.current) setOpen(true);
    if (!st.live) setOpen(false);
    wasLive.current = st.live;
  }, [st.live]);
  if (!open || !st.live) return null;
  const w = WORKSHOP_DAYS[st.liveIdx];
  const s = Math.floor(st.msToEnd / 1000);
  const cd = String(Math.floor(s / 3600)).padStart(2, "0") + ":" + String(Math.floor((s % 3600) / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  const res = wsResultFor(w.day);
  return (
    <div className="ws-modal" onClick={() => setOpen(false)}>
      <div className="ws-modal-card" onClick={e => e.stopPropagation()}>
        <span className="ws-modal-close" onClick={() => setOpen(false)}>×</span>
        <div style={{ fontSize: "40px", lineHeight: 1 }}>🔧</div>
        <h3>{T("Order Workshop is Live!")}</h3>
        <div style={{ fontSize: "14px", color: "#e2e8f0" }}>{T("Battle Day")} {w.day - 1}{res && res.opponent ? " · vs " + res.opponent : ""}</div>
        <div style={{ fontSize: "11px", color: "#64748b", margin: "12px 0 2px", letterSpacing: "0.5px", textTransform: "uppercase" }}>{T("Our event (19:00 UTC) ends in")}</div>
        <div className="ws-modal-cd">{cd}</div>
      </div>
    </div>
  );
}

          ))}
        </div>
        <div style={{ marginTop: 16 }}>
          {tab === "overview" && <OverviewTab />}
          {tab === "scouting" && <ResearchTab />}
          {tab === "points"   && <ScoringTab />}
          {tab === "guide"    && <GuideTab />}
        </div>

        <div style={{ textAlign: "center", padding: "24px 0", borderTop: "1px solid var(--border,#2a2a3a)", marginTop: 24, fontFamily: "'Barlow Condensed',sans-serif", fontSize: 12, color: "#64748b", letterSpacing: ".5px" }}>
          {T("Primordial Conflict · Era 8 (E#008 ERAEMPIRE) · Special KvK — no troop loss · vs Era #028 / Era #088 / Era #059")}
        </div>
      </div>
    </div>
  );
}

const S = {
  header: {
    position: "relative", maxWidth: 960, width: "100%", margin: "0 auto", textAlign: "center",
    padding: "56px 20px 32px", minHeight: 240, display: "flex", flexDirection: "column",
    justifyContent: "center", alignItems: "center",
    borderBottom: "2px solid var(--kvk-accent-dim, #6b4c9a)",
    background: "linear-gradient(to bottom, rgba(10,12,20,0.30) 0%, rgba(10,12,20,0.62) 60%, #0a0c14 100%), radial-gradient(ellipse at center top, rgba(155,109,255,0.30) 0%, transparent 60%), url('../assets/kvk-bg/primordial.jpg')",
    backgroundSize: "cover,cover,cover", backgroundPosition: "center top", backgroundRepeat: "no-repeat",
  },
  headerTitle: {
    fontFamily: "'Bebas Neue', sans-serif", fontSize: "clamp(40px,8vw,64px)", letterSpacing: "3px", lineHeight: 1,
    background: "linear-gradient(90deg, #b58bff, #9b6dff)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", margin: 0,
  },
  headerSub: { fontFamily: "'Barlow Condensed', sans-serif", fontSize: "13px", letterSpacing: "1px", color: "#94a3b8", marginTop: "4px", textTransform: "uppercase" },
};

// ── Boot: overlay published rosters, then render ──
(async () => {
  try {
    const res = await fetch("../data/live/primordial.json");
    if (res.ok) {
      const j = await res.json();
      if (j && j.research) RESEARCH = j.research;
      if (j && Array.isArray(j.kingdomScoreboard)) KINGDOM_SCOREBOARD = j.kingdomScoreboard;
      if (j && j.scoreUpdated) SCORE_UPDATED = j.scoreUpdated;
      if (j && Array.isArray(j.workshopResults)) WORKSHOP_RESULTS = j.workshopResults;
    }
  } catch (e) { console.error("primordial roster load failed", e); }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
})();
</script>
