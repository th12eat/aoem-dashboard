<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Era 8 Command</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/kvk-theme.css">
  <style>
    body { background: var(--bg-deep); color: var(--text-primary); font-family: 'Barlow', sans-serif;
           margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { width: 100%; max-width: 380px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 14px; padding: 30px 26px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .brand { text-align: center; margin-bottom: 18px; }
    .brand .mark { color: var(--kvk-accent); font-size: 26px; }
    .brand h1 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; margin: 4px 0 0; }
    .brand .sub { color: var(--text-secondary); font-size: 13px; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; }
    .banner { background: rgba(212,168,67,0.08); border: 1px dashed var(--kvk-accent-dim); border-radius: 8px;
              padding: 9px 12px; font-size: 12px; color: var(--kvk-accent); text-align: center; margin-bottom: 18px;
              font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.5px; }
    label { display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 12px;
            letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin: 12px 0 5px; }
    input { width: 100%; box-sizing: border-box; background: var(--bg-deep); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 12px; color: var(--text-primary); font-size: 14px; font-family: 'Barlow', sans-serif; }
    input:focus { outline: none; border-color: var(--kvk-accent-dim); }
    .btn { width: 100%; margin-top: 18px; padding: 11px; border: none; border-radius: 8px; cursor: pointer;
           background: var(--kvk-accent); color: var(--bg-deep); font-family: 'Barlow Condensed', sans-serif;
           font-weight: 700; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
    .btn:hover { filter: brightness(1.08); }
    .msg { margin-top: 12px; font-size: 12.5px; text-align: center; min-height: 1.2em; color: var(--accent-gold); }
    .back { display: block; text-align: center; margin-top: 16px; color: var(--text-muted); font-size: 12px; text-decoration: none;
            font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; }
    .back:hover { color: var(--kvk-accent); }
  </style>
</head>
<body data-kvk="generic">
  <div class="card">
    <div class="brand">
      <div class="mark">◆</div>
      <h1>Era 8 Command</h1>
      <div class="sub" data-i18n="lg_sub">Maintainer Sign-In</div>
    </div>

    <div class="banner"><span data-i18n="lg_banner">⚙ Preview build — sign-in activates when hosted.</span></div>

    <form id="loginForm" autocomplete="off">
      <label for="username" data-i18n="lg_user">Username</label>
      <input type="text" id="username" name="username" placeholder="commander" autocomplete="username">

      <label for="password" data-i18n="lg_pass">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">

      <button type="submit" class="btn" data-i18n="lg_btn">Sign In</button>
      <div class="msg" id="msg"></div>
    </form>

    <a class="back" href="../index.html" data-i18n="lg_back">← Back to Era 8 Command</a>
  </div>

  <script src="../assets/auth.js"></script>
  <script src="../assets/site-header.js"></script>
  <script>
    // i18n for the sign-in page (shares the persisted language via SiteHeader).

{"lg_sub":"Ylläpitäjän kirjautuminen","lg_banner":"⚙ Esikatseluversio — kirjautuminen aktivoituu isännöitäessä.","lg_user":"Käyttäjänimi","lg_pass":"Salasana","lg_btn":"Kirjaudu sisään","lg_back":"← Takaisin Era 8 Commandiin","lg_msg":"Kirjautuminen on poistettu käytöstä tässä esikatseluversiossa."},"nb":{"lg_sub":"Vedlikeholder-innlogging","lg_banner":"⚙ Forhåndsversjon — innlogging aktiveres ved hosting.","lg_user":"Brukernavn","lg_pass":"Passord","lg_btn":"Logg inn","lg_back":"← Tilbake til Era 8 Command","lg_msg":"Innlogging er deaktivert i denne forhåndsversjonen."},"da":{"lg_sub":"Vedligeholder-login","lg_banner":"⚙ Forhåndsversion — login aktiveres ved hosting.","lg_user":"Brugernavn","lg_pass":"Adgangskode","lg_btn":"Log ind","lg_back":"← Tilbage til Era 8 Command","lg_msg":"Login er deaktiveret i denne forhåndsversion."},"ru":{"lg_sub":"Вход для сопровождающего","lg_banner":"⚙ Предварительная сборка — вход активируется при размещении.","lg_user":"Имя пользователя","lg_pass":"Пароль","lg_btn":"Войти","lg_back":"← Назад в Era 8 Command","lg_msg":"Вход отключён в этой предварительной сборке."},"ko":{"lg_sub":"관리자 로그인","lg_banner":"⚙ 미리보기 빌드 — 로그인은 호스팅 시 활성화됩니다.","lg_user":"사용자 이름","lg_pass":"비밀번호","lg_btn":"로그인","lg_back":"← Era 8 Command로 돌아가기","lg_msg":"이 미리보기 빌드에서는 로그인이 비활성화되어 있습니다."},"ja":{"lg_sub":"メンテナーサインイン","lg_banner":"⚙ プレビュー版 — サインインはホスティング時に有効化。","lg_user":"ユーザー名","lg_pass":"パスワード","lg_btn":"サインイン","lg_back":"← Era 8 Command に戻る","lg_msg":"このプレビュー版ではサインインは無効です。"},"zh_cn":{"lg_sub":"维护者登录","lg_banner":"⚙ 预览版本 — 登录将于托管后启用。","lg_user":"用户名","lg_pass":"密码","lg_btn":"登录","lg_back":"← 返回 Era 8 Command","lg_msg":"此预览版本已禁用登录。"},"ar":{"lg_sub":"تسجيل دخول القائم بالصيانة","lg_banner":"⚙ إصدار معاينة — تسجيل الدخول يُفعّل عند الاستضافة.","lg_user":"اسم المستخدم","lg_pass":"كلمة المرور","lg_btn":"تسجيل الدخول","lg_back":"← العودة إلى Era 8 Command","lg_msg":"تسجيل الدخول معطّل في إصدار المعاينة هذا."},"si":{"lg_sub":"නඩත්තුකරු පිවිසුම","lg_banner":"⚙ පෙරදසුන් අනුවාදය — පිවිසීම සත්කාරකත්වයේදී සක්‍රිය වේ.","lg_user":"පරිශීලක නාමය","lg_pass":"මුරපදය","lg_btn":"පිවිසෙන්න","lg_back":"← Era 8 Command වෙත ආපසු","lg_msg":"මෙම පෙරදසුන් අනුවාදයේ පිවිසීම අක්‍රියයි."},"ta":{"lg_sub":"பராமரிப்பாளர் உள்நுழைவு","lg_banner":"⚙ முன்னோட்ட பதிப்பு — உள்நுழைவு ஹோஸ்ட் செய்யும்போது செயல்படும்.","lg_user":"பயனர்பெயர்","lg_pass":"கடவுச்சொல்","lg_btn":"உள்நுழை","lg_back":"← Era 8 Command க்குத் திரும்பு","lg_msg":"இந்த முன்னோட்ட பதிப்பில் உள்நுழைவு முடக்கப்பட்டுள்ளது."},"hi":{"lg_sub":"अनुरक्षक साइन-इन","lg_banner":"⚙ पूर्वावलोकन बिल्ड — साइन-इन होस्ट होने पर सक्रिय होता है।","lg_user":"उपयोगकर्ता नाम","lg_pass":"पासवर्ड","lg_btn":"साइन इन","lg_back":"← Era 8 Command पर वापस","lg_msg":"इस पूर्वावलोकन बिल्ड में साइन-इन अक्षम है।"},"zh_hk":{"lg_sub":"維護者登錄","lg_banner":"⚙ 預覽版本 — 登錄將於託管後啓用。","lg_user":"用户名","lg_pass":"密碼","lg_btn":"登錄","lg_back":"← 返回 Era 8 Command","lg_msg":"此預覽版本已禁用登錄。"}};
      var CODES = ['en','es','fr','ko','ja','zh_hk','zh_cn','pt','sv','fi','nb','nl','de','ar','si','ta','hi','da','ru','it'];
      var RTL = { ar: true };
      var EN = {}, curLang = 'en';
      document.querySelectorAll('[data-i18n]').forEach(function (el) { EN[el.getAttribute('data-i18n')] = el.innerHTML; });
      function apply(lang) {
        curLang = lang;
        var t = (lang === 'en') ? EN : (TR[lang] || {});
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', RTL[lang] ? 'rtl' : 'ltr');
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var k = el.getAttribute('data-i18n');
          var v = (Object.prototype.hasOwnProperty.call(t, k)) ? t[k] : EN[k];
          if (v !== undefined) el.innerHTML = v;
        });
      }
      window.__loginMsg = function () {
        var t = (curLang === 'en') ? null : (TR[curLang] || {});
        return (t && t.lg_msg) ? t.lg_msg : 'Sign-in is disabled in this preview build.';
      };
      function register() {
        if (window.SiteHeader) { window.SiteHeader.setLanguages({ codes: CODES, current: 'en', onChange: apply }); }
        else { setTimeout(register, 50); }
      }
      register();
    })();
    // PREVIEW BUILD: submit handler intentionally NOT wired to Auth.login().
    (function () {
      var form = document.getElementById('loginForm');
      var msg = document.getElementById('msg');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        msg.textContent = window.__loginMsg ? window.__loginMsg() : 'Sign-in is disabled in this preview build.';
      });
    })();
  </script>
</body>
</html>
